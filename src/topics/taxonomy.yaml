# Controlled Topic Taxonomy for CustomerVoice AI
version: "1.0.0"
taxonomy:
  product_quality:
    display_name: "Product Quality"
    description: "Physical build, materials, craftsmanship, durability, or defects."
    keywords:
      - "quality"
      - "build quality"
      - "material"
      - "materials"
      - "craftsmanship"
      - "defective"
      - "defect"
      - "durable"
      - "durability"
      - "sturdy"
      - "broken"
      - "cheaply made"
      - "flimsy"
      - "plastic"
      - "well made"
      - "solid"

  battery:
    display_name: "Battery & Charging"
    description: "Battery lifespan, charging performance, drain rates, or power adapters."
    keywords:
      - "battery"
      - "batteries"
      - "battery life"
      - "charge"
      - "charging"
      - "charger"
      - "drain"
      - "draining"
      - "recharge"
      - "power bank"
      - "standby time"
      - "overheating while charging"

  performance:
    display_name: "Performance & Speed"
    description: "Operational speed, latency, lag, responsiveness, or processing capability."
    keywords:
      - "performance"
      - "fast"
      - "speed"
      - "slow"
      - "sluggish"
      - "lag"
      - "lagging"
      - "latency"
      - "responsive"
      - "responsiveness"
      - "freeze"
      - "freezing"
      - "stutter"
      - "smooth"
      - "frame rate"

  delivery:
    display_name: "Shipping & Delivery"
    description: "Shipping speed, logistics, couriers, transit times, or delivery status."
    keywords:
      - "delivery"
      - "deliver"
      - "shipping"
      - "shipped"
      - "courier"
      - "transit"
      - "tracking"
      - "arrived"
      - "dispatch"
      - "late delivery"
      - "delayed shipment"
      - "on time"
      - "estimated arrival"

  customer_support:
    display_name: "Customer Support"
    description: "Support staff interactions, response times, ticket handling, or helpdesk assistance."
    keywords:
      - "customer support"
      - "customer service"
      - "support team"
      - "helpdesk"
      - "representative"
      - "support agent"
      - "never replied"
      - "no response"
      - "service rep"
      - "call center"
      - "live chat"
      - "ticket"
      - "unhelpful"
      - "helpline"

  pricing:
    display_name: "Pricing & Value"
    description: "Retail cost, perceived value, discounts, affordability, or pricing fairness."
    keywords:
      - "price"
      - "pricing"
      - "expensive"
      - "cost"
      - "costly"
      - "overpriced"
      - "affordable"
      - "value for money"
      - "worth the money"
      - "cheap"
      - "discount"
      - "rip off"
      - "budget"

  refund:
    display_name: "Refunds & Reimbursements"
    description: "Money-back guarantees, compensation, chargebacks, or refund processing."
    keywords:
      - "refund"
      - "refunds"
      - "refunded"
      - "money back"
      - "reimburse"
      - "reimbursement"
      - "chargeback"
      - "billing error"
      - "credits"

  return:
    display_name: "Returns & Exchanges"
    description: "Return authorizations, product replacements, return shipping, or exchange policies."
    keywords:
      - "return"
      - "returned"
      - "returning"
      - "replacement"
      - "replace"
      - "replaced"
      - "exchange"
      - "exchanged"
      - "return policy"
      - "rma"
      - "send back"

  packaging:
    display_name: "Packaging & Unboxing"
    description: "Product box condition, protective wrapping, seals, or packaging presentation."
    keywords:
      - "packaging"
      - "package"
      - "box"
      - "unboxing"
      - "bubble wrap"
      - "cardboard"
      - "damaged box"
      - "crushed box"
      - "tampered seal"
      - "packed well"
      - "securely packed"

  usability:
    display_name: "Usability & Ease of Use"
    description: "User experience, initial configuration, clarity of manual, or user friendliness."
    keywords:
      - "easy to use"
      - "usability"
      - "user friendly"
      - "intuitive"
      - "difficult to use"
      - "complicated"
      - "setup"
      - "instruction manual"
      - "confusing"
      - "ergonomic"
      - "steep learning curve"
      - "simple to operate"

  features:
    display_name: "Features & Capabilities"
    description: "Product specifications, technical modes, hardware options, or software features."
    keywords:
      - "feature"
      - "features"
      - "functionality"
      - "specification"
      - "specs"
      - "bluetooth"
      - "wifi"
      - "connectivity"
      - "settings"
      - "options"
      - "customization"
      - "modes"
      - "capabilities"

  reliability:
    display_name: "Reliability & Stability"
    description: "Long-term dependability, crash frequency, glitches, unexpected shutdowns, or faults."
    keywords:
      - "reliable"
      - "reliability"
      - "unreliable"
      - "crash"
      - "crashed"
      - "crashing"
      - "glitch"
      - "glitches"
      - "reboot"
      - "random shutdown"
      - "disconnect"
      - "disconnecting"
      - "fault"
      - "unstable"
      - "stable"
